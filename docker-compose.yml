services:
  db:
    image: pgvector/pgvector:pg16
    container_name: db
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app-network

  api:
    build: .
    container_name: pt-llm-assistant
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - app-network

  frontend:
    build: .
    container_name: pt-llm-assistant-frontend
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
    depends_on:
      api:
        condition: service_started
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8080
    networks:
      - app-network

networks:
  app-network:

volumes:
  db_data:
